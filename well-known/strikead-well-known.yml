note: >-
  NO DOCUMENTS FOUND. strikead.com is a parked domain served from GoDaddy
  nameservers (ns71/ns72.domaincontrol.com) with a catch-all responder: EVERY
  path returns the identical 114-byte HTML lander
  (<script>window.location.href="/lander"</script>) with HTTP 200 and
  Content-Type: text/html. A deliberate negative-control probe of
  /this-path-does-not-exist-12345 returned the same 200 + same 114 bytes,
  proving the 200s are a soft-200 catch-all and NOT served documents.
  Therefore no WellKnown or SecurityTxt pointer is emitted in apis.yml —
  a 200 that returns an HTML parking shell is not a document.
  The single non-HTML response, /llms.txt, returns 65 bytes of robots.txt
  directives ("User-agent: * / Allow: / / Disallow-Training: / / Sitemap:")
  emitted by the parking provider, not an llms.txt index of the company's
  documentation; it is recorded here and NOT saved as an LLMsTxt artifact.
  Subdomains api., docs. and developer.strikead.com do not resolve at all.
