name: StrikeAd
description: StrikeAd was a mobile advertising technology company, founded in New York City
  in 2010 and backed by Uncork Capital, that built Fusion - one of the first demand-side
  platforms (DSPs) built specifically for mobile programmatic advertising. Sizmek Inc.
  completed its acquisition of StrikeAd for approximately $11.7 million in May 2015 and
  folded the platform into Sizmek MDX; Sizmek itself was subsequently broken up, with its
  ad server going to Amazon and its DSP and DMP to Zeta Global. The StrikeAd brand no
  longer operates. Its primary domain (strikead.com) is now a parked domain on GoDaddy
  nameservers that answers every request - homepage, /.well-known/ discovery paths, and
  common contract paths alike - with the same 114-byte HTML lander redirect to /lander,
  confirmed against a negative-control path. The api., docs. and developer. subdomains do
  not resolve, and the github.com/strikead organization is named "ex-StrikeAd" and has
  zero public repositories. No developer portal, API documentation, OpenAPI definition,
  or other machine-readable API surface exists.
